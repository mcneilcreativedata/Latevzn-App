<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes the app size itself nicely on phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Latevzn</title>
  <meta name="description" content="Latevzn — a personal photography reflection journal." />

  <!-- The browser bar colour. The app commits to a single black look. -->
  <meta name="theme-color" content="#000000" />

  <!-- Browser tab / bookmark icon. -->
  <link rel="icon" href="./icons/icon-192.png" />

  <!-- Lets the app be installed and behave like a real app on a phone. -->
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- Icon used when added to an iPhone home screen. -->
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Latevzn" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a class="app-title" href="#/" aria-label="Latevzn — Field Guide">
      <!-- The logo filename has spaces, so the src is URL-encoded (%20). If the
           image ever fails to load, onerror swaps in the "LATEVZN" wordmark so
           the header never looks broken. -->
      <img class="app-logo" src="./LATE%20VZN%20LOGO.png" alt="LATEVZN"
           onerror="this.onerror=null;this.insertAdjacentHTML('afterend','<span class=&quot;app-wordmark&quot;>LATEVZN</span>');this.remove();" />
      <span class="app-subtitle">Field Guide</span>
    </a>
  </header>

  <!-- Every screen is drawn inside here by js/app.js. -->
  <main id="app" class="app-main">
    <p class="intro">Loading…</p>
  </main>

  <!-- Dexie: the small library that saves your writing on the device.
       Loaded from a local file (not the internet) so the app works offline.
       This plain script runs first, before the app module below. -->
  <script src="./vendor/dexie.min.js"></script>

  <!-- type="module" lets us split the code into small files that load directly. -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
